version: 2

# Groups take minor and patch updates only; each major bump gets its own PR.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    # The base image tag already floats within its image version; the Python version is changed by hand.
    ignore:
      - dependency-name: mcr.microsoft.com/devcontainers/python
    groups:
      devcontainer:
        patterns: ["*"]
        update-types: [minor, patch]
